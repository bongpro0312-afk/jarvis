<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>JARVIS</title>
<meta name="theme-color" content="#05080d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#05080d; --panel:#0b121b; --line:#16324a; --text:#d8ecff; --dim:#6f8aa3;
  --cyan:#36d1ff; --cyan2:#7fe3ff; --warn:#ffb347; --err:#ff6b6b; --me:#12324a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body{display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
header h1{font-size:15px;letter-spacing:6px;margin:0;color:var(--cyan);font-weight:600}
.iconbtn{background:none;border:1px solid var(--line);color:var(--dim);border-radius:10px;
  padding:7px 11px;font-size:13px;cursor:pointer}
.iconbtn:active{background:var(--panel)}
#log{flex:1;overflow-y:auto;padding:4px 16px 12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;line-height:1.55;font-size:15px;white-space:pre-wrap;word-break:break-word}
.me{align-self:flex-end;background:var(--me);border-bottom-right-radius:4px}
.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.sys{align-self:center;color:var(--dim);font-size:12.5px;text-align:center;max-width:95%}
.sys.err{color:var(--err)}
#stage{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 16px 14px}
#orb{width:132px;height:132px;border-radius:50%;border:none;cursor:pointer;position:relative;
  background:radial-gradient(circle at 50% 50%,#bff3ff 0%,#36d1ff 18%,#0b4f72 46%,#06131e 70%);
  box-shadow:0 0 22px #36d1ff55,inset 0 0 18px #36d1ff88;transition:transform .15s}
#orb::before,#orb::after{content:"";position:absolute;inset:-10px;border-radius:50%;
  border:2px solid #36d1ff44}
#orb::after{inset:-22px;border:1px dashed #36d1ff33;animation:spin 18s linear infinite}
#orb:active{transform:scale(.96)}
#orb.listening{animation:pulse 1.1s ease-in-out infinite}
#orb.thinking::after{border-color:#36d1ffaa;animation:spin 1.4s linear infinite}
#orb.speaking{animation:speak .45s ease-in-out infinite alternate}
@keyframes pulse{0%,100%{box-shadow:0 0 22px #36d1ff55,inset 0 0 18px #36d1ff88}50%{box-shadow:0 0 60px #36d1ffcc,inset 0 0 30px #bff3ff}}
@keyframes speak{from{transform:scale(1)}to{transform:scale(1.05)}}
@keyframes spin{to{transform:rotate(360deg)}}
#status{font-size:13px;color:var(--dim);min-height:18px;text-align:center}
#live{font-size:15px;color:var(--cyan2);min-height:20px;text-align:center;max-width:100%}
.row{display:flex;gap:8px;width:100%;max-width:640px}
#text{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;
  padding:11px 12px;font-size:16px;outline:none}
#text:focus{border-color:var(--cyan)}
.btn{background:var(--cyan);color:#022;border:none;border-radius:12px;padding:0 16px;font-weight:600;font-size:15px;cursor:pointer}
.toggles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{font-size:12.5px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--dim);background:none;cursor:pointer}
.chip.on{border-color:var(--cyan);color:var(--cyan)}
/* settings */
#sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:9}
#sheet.open{display:flex}
#sheet .box{background:var(--panel);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;
  border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
#sheet h2{margin:0 0 12px;font-size:17px}
#sheet label{display:block;font-size:13px;color:var(--dim);margin:14px 0 6px}
#sheet input,#sheet textarea,#sheet select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:10px;font-size:15px;font-family:inherit}
#sheet textarea{min-height:120px;resize:vertical;line-height:1.5}
#sheet .hint{font-size:12px;color:var(--dim);margin-top:5px;line-height:1.5}
#sheet .actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
#sheet .actions button{flex:1;min-width:120px;padding:12px;border-radius:12px;font-size:15px;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);color:var(--text)}
a{color:var(--cyan)}
#voiceList{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.vrow{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.vrow.sel{border-color:var(--cyan)}
.vrow .vn{flex:1;font-size:14px}
.vrow button{background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
.vrow.sel .pick{background:var(--cyan);color:#022;border-color:var(--cyan)}
</style>
</head>
<body>
<header>
  <h1>J.A.R.V.I.S</h1>
  <div style="display:flex;gap:8px">
    <button class="iconbtn" id="newBtn" title="새 대화">새 대화</button>
    <button class="iconbtn" id="setBtn" title="설정">설정</button>
  </div>
</header>

<div id="log"></div>

<div id="stage">
  <div id="live"></div>
  <button id="orb" aria-label="말하기"></button>
  <div id="status">가운데를 누르고 말씀하세요</div>
  <div class="toggles">
    <button class="chip" id="handsfree">연속 대화</button>
    <button class="chip on" id="voiceOut">음성으로 대답</button>
  </div>
  <form class="row" id="form">
    <input id="text" autocomplete="off" placeholder="또는 여기에 입력하세요">
    <button class="btn" type="submit">보내기</button>
  </form>
</div>

<div id="sheet">
  <div class="box">
    <h2>자비스 설정</h2>

    <label for="apiKey">Claude API 키</label>
    <input id="apiKey" type="password" placeholder="sk-ant-..." autocomplete="off">
    <div class="hint">키는 이 기기 안에만 저장돼요. 발급: <a href="https://platform.claude.com/settings/keys" target="_blank" rel="noopener">platform.claude.com</a></div>

    <label for="userName">저를 부를 이름</label>
    <input id="userName" placeholder="제이슨님">

    <label for="model">두뇌 (모델)</label>
    <select id="model">
      <option value="claude-opus-5-5">Opus 5.5 · 가장 똑똑함 (기본)</option>
      <option value="claude-sonnet-5-5">Sonnet 5.5 · 빠르고 저렴함</option>
      <option value="claude-haiku-5-5">Haiku 5.5 · 가장 빠르고 아주 저렴함</option>
    </select>

    <label for="voice">목소리</label>
    <select id="voice"></select>
    <div id="voiceList"></div>
    <div class="hint">맥·아이폰 설정 &gt; 손쉬운 사용 &gt; 읽기 및 말하기 &gt; 음성에서 한국어 고품질 음성(예: Yuna 향상됨)을 내려받으면 더 자연스러워져요.</div>

    <label for="rate">말 빠르기</label>
    <input id="rate" type="range" min="0.7" max="1.4" step="0.05" value="0.95">

    <label for="pitch">목소리 높낮이 (왼쪽일수록 낮고 묵직함)</label>
    <input id="pitch" type="range" min="0.5" max="1.5" step="0.05" value="0.8">
    <div class="actions">
      <button class="ghost" id="previewBtn" type="button">미리 듣기</button>
      <button class="ghost" id="jarvisPreset" type="button">자비스 스타일로</button>
    </div>

    <label for="briefing">프로젝트 브리핑 (자비스가 항상 알고 있을 내용)</label>
    <textarea id="briefing" placeholder="예) 허니봉: 캠핑 인스타 계정, 이번 주 릴스 2개 업로드 예정&#10;THE RAM: PPF 사업, theramdio.kr 자동견적 시스템 운영 중"></textarea>

    <label for="memories">자비스가 기억한 것</label>
    <textarea id="memories" placeholder="대화 중 &quot;기억해&quot;라고 말하면 여기에 쌓여요"></textarea>

    <label>폰 ↔ 맥 옮기기</label>
    <div class="hint">한쪽에서 "설정 복사"를 누르고, 다른 기기에서 "설정 붙여넣기"를 누르면 키·브리핑·기억이 그대로 옮겨져요.</div>
    <div class="actions">
      <button class="ghost" id="exportBtn" type="button">설정 복사</button>
      <button class="ghost" id="importBtn" type="button">설정 붙여넣기</button>
    </div>

    <div class="actions">
      <button class="ghost" id="closeBtn" type="button">닫기</button>
      <button class="btn" id="saveBtn" type="button">저장</button>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
const LS = {
  get(k, d) { try { const v = localStorage.getItem("jarvis." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("jarvis." + k, JSON.stringify(v)); } catch {} },
};

let settings = Object.assign({
  apiKey: "", userName: "제이슨님", model: "claude-opus-5-5", voice: "", rate: 0.95, pitch: 0.8,
  briefing: "", memories: "", handsfree: false, voiceOut: true,
}, LS.get("settings", {}));
let history = LS.get("history", []);   // [{role, content:string}]
const MAX_TURNS = 30;

// ---------- UI helpers ----------
const log = $("log");
function addMsg(role, text, cls = "") {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "me" : role === "assistant" ? "ai" : "sys " + cls);
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}
function setStatus(t) { $("status").textContent = t; }
function setOrb(state) { $("orb").className = state || ""; }
function renderHistory() {
  log.innerHTML = "";
  if (!history.length) addMsg("sys", "안녕하세요. 자비스입니다. 가운데 원을 누르고 말씀하세요.");
  for (const m of history) addMsg(m.role, m.content);
}

// ---------- Speech output ----------
const synth = window.speechSynthesis;
let koVoices = [];
function loadVoices() {
  if (!synth) return;
  const all = synth.getVoices();
  koVoices = all.filter(v => /^ko/i.test(v.lang));
  const sel = $("voice");
  sel.innerHTML = "";
  const list = koVoices.length ? koVoices : all;
  for (const v of list) {
    const o = document.createElement("option");
    o.value = v.name; o.textContent = v.name + (v.localService ? "" : " (온라인)");
    sel.appendChild(o);
  }
  if (!list.length) { const o = document.createElement("option"); o.textContent = "기본 목소리"; o.value = ""; sel.appendChild(o); }
  if (!settings.voice) {
    const best = koVoices.find(v => /^reed/i.test(v.name)) || koVoices.find(v => /^(eddy|rocko)/i.test(v.name)) || koVoices[0];
    if (best) settings.voice = best.name;
  }
  sel.value = settings.voice;
  renderVoiceList(list);
}
function renderVoiceList(list) {
  const box = $("voiceList"); if (!box) return;
  box.innerHTML = "";
  for (const v of list) {
    const row = document.createElement("div");
    row.className = "vrow" + ($("voice").value === v.name ? " sel" : "");
    const n = document.createElement("span"); n.className = "vn"; n.textContent = v.name.replace(/\s*\(.*\)$/, "");
    const play = document.createElement("button"); play.type = "button"; play.textContent = "▶ 듣기";
    play.onclick = () => {
      unlockAudio(); stopSpeaking();
      const u = new SpeechSynthesisUtterance(`안녕하세요, ${$("userName").value || "제이슨님"}. 자비스입니다. 모든 시스템이 정상 작동 중입니다.`);
      u.lang = "ko-KR"; u.voice = v; u.rate = Number($("rate").value) || 1; u.pitch = Number($("pitch").value) || 1;
      synth.speak(u);
    };
    const pick = document.createElement("button"); pick.type = "button"; pick.className = "pick";
    pick.textContent = $("voice").value === v.name ? "선택됨" : "선택";
    pick.onclick = () => { $("voice").value = v.name; renderVoiceList(list); };
    row.append(n, play, pick); box.appendChild(row);
  }
}
if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }

let speakQueue = 0, speakDone = null;
function cleanForSpeech(t) {
  return t.replace(/https?:\/\/\S+/g, "")
          .replace(/[*#_`>|~]/g, "")
          .replace(/\[(.*?)\]\(.*?\)/g, "$1")
          .replace(/\s+/g, " ").trim();
}
function speak(text) {
  if (!synth || !settings.voiceOut) return;
  const t = cleanForSpeech(text);
  if (!t) return;
  const u = new SpeechSynthesisUtterance(t);
  u.lang = "ko-KR";
  u.rate = Number(settings.rate) || 1;
  u.pitch = Number(settings.pitch) || 1;
  const v = synth.getVoices().find(v => v.name === settings.voice);
  if (v) u.voice = v;
  speakQueue++;
  setOrb("speaking");
  u.onend = u.onerror = () => {
    speakQueue = Math.max(0, speakQueue - 1);
    if (!speakQueue && speakDone) { const f = speakDone; speakDone = null; f(); }
  };
  synth.speak(u);
}
function stopSpeaking() { if (synth) synth.cancel(); speakQueue = 0; speakDone = null; }
function whenSpeechDone(fn) { if (!speakQueue) fn(); else speakDone = fn; }
// iOS needs speech unlocked inside a tap
let unlocked = false;
function unlockAudio() {
  if (unlocked || !synth) return;
  unlocked = true;
  const u = new SpeechSynthesisUtterance(" "); u.volume = 0; synth.speak(u);
}

// ---------- Speech input ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, finalText = "";
function startListening() {
  if (!SR) {
    setStatus("이 브라우저는 음성 인식을 지원하지 않아요. 키보드의 마이크 버튼으로 말해도 돼요.");
    $("text").focus();
    return;
  }
  stopSpeaking();
  rec = new SR();
  rec.lang = "ko-KR";
  rec.interimResults = true;
  rec.continuous = false;
  finalText = "";
  rec.onstart = () => { listening = true; setOrb("listening"); setStatus("듣고 있어요…"); $("live").textContent = ""; };
  rec.onresult = (e) => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
    }
    $("live").textContent = (finalText + interim).trim();
  };
  rec.onerror = (e) => {
    listening = false; setOrb("");
    const map = { "not-allowed": "마이크 권한이 꺼져 있어요. 브라우저 설정에서 마이크를 허용해 주세요.",
                  "no-speech": "아무 말도 들리지 않았어요.", "network": "음성 인식 서버에 연결하지 못했어요." };
    setStatus(map[e.error] || ("음성 인식 오류: " + e.error));
  };
  rec.onend = () => {
    listening = false;
    const t = (finalText || $("live").textContent).trim();
    $("live").textContent = "";
    if (t) send(t);
    else if ($("orb").className === "listening") { setOrb(""); setStatus("가운데를 누르고 말씀하세요"); }
  };
  try { rec.start(); } catch (e) { setStatus("음성 인식을 시작하지 못했어요."); }
}
function stopListening() { if (rec && listening) rec.stop(); }

// ---------- Claude ----------
let busy = false, abortCtl = null;
function systemPrompt() {
  const now = new Date().toLocaleString("ko-KR", { dateStyle: "full", timeStyle: "short" });
  return [
`너는 "자비스(JARVIS)"다. 영화 아이언맨의 AI 비서처럼, ${settings.userName || "사용자"}의 개인 비서로서 음성으로 대화한다.`,
`말투: 정중하지만 친근하고 재치 있는 한국어 존댓말. 사용자를 "${settings.userName || "님"}"이라고 부른다.`,
`대답은 소리 내어 읽힌다. 그러니 마크다운, 표, 글머리 기호, 이모지, 링크를 쓰지 말고 자연스러운 말로 한다.`,
`기본은 2~4문장으로 짧게. 사용자가 자세히 원할 때만 길게 말한다. 핵심을 먼저 말한다.`,
`최신 정보(날씨, 뉴스, 가격 등)가 필요하면 웹 검색 도구를 쓴다.`,
`사용자가 무언가를 기억하라고 하거나, 앞으로도 알아야 할 중요한 사실을 말하면, 대답 맨 끝에 [[기억: 한 줄 요약]] 을 붙인다. 이 표시는 화면과 음성에서 지워진다.`,
`지금 시각: ${now}`,
settings.briefing ? `\n<프로젝트_브리핑>\n${settings.briefing}\n</프로젝트_브리핑>` : "",
settings.memories ? `\n<기억>\n${settings.memories}\n</기억>` : "",
  ].join("\n");
}

async function callClaude(messages, withFallback) {
  const headers = {
    "content-type": "application/json",
    "x-api-key": settings.apiKey,
    "anthropic-version": "2023-06-01",
    "anthropic-dangerous-direct-browser-access": "true",
  };
  const body = {
    model: settings.model,
    max_tokens: 8000,
    stream: true,
    system: systemPrompt(),
    messages,
    output_config: { effort: "low" },
    tools: [{ type: "web_search_20260209", name: "web_search", max_uses: 3,
              user_location: { type: "approximate", country: "KR", timezone: "Asia/Seoul" } }],
  };
  if (withFallback) {
    headers["anthropic-beta"] = "server-side-fallback-2026-07-01";
    body.fallbacks = "default";
  }
  abortCtl = new AbortController();
  return fetch("https://api.anthropic.com/v1/messages", {
    method: "POST", headers, body: JSON.stringify(body), signal: abortCtl.signal,
  });
}

async function send(text) {
  text = text.trim();
  if (!text || busy) return;
  if (!settings.apiKey) { openSettings(); setStatus("먼저 API 키를 넣어주세요."); return; }
  unlockAudio();
  busy = true;
  history.push({ role: "user", content: text });
  addMsg("user", text);
  setOrb("thinking"); setStatus("생각 중…");

  const msgs = history.slice(-MAX_TURNS * 2);
  while (msgs.length && msgs[0].role !== "user") msgs.shift();

  let res;
  try {
    res = await callClaude(msgs, true);
    if (res.status === 400) {
      const peek = await res.clone().text();
      if (/fallback|beta/i.test(peek)) res = await callClaude(msgs, false);
    }
  } catch (e) {
    return fail("인터넷 연결을 확인해 주세요.");
  }
  if (!res.ok) {
    let msg = "오류가 났어요 (" + res.status + ").";
    try { const j = await res.json(); if (j.error?.message) msg += " " + j.error.message; } catch {}
    if (res.status === 401) msg = "API 키가 맞지 않아요. 설정에서 다시 확인해 주세요.";
    if (res.status === 429) msg = "요청이 너무 많아요. 잠시 후 다시 말씀해 주세요.";
    if (res.status === 529) msg = "Claude 서버가 바빠요. 잠시 후 다시 시도해 주세요.";
    return fail(msg);
  }

  const bubble = addMsg("assistant", "");
  let full = "", spokenUpTo = 0, stopReason = null, searching = false;
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = "";

  const flushSpeech = (final) => {
    const visible = stripMemory(full);
    let chunk = visible.slice(spokenUpTo);
    if (!final) {
      const m = chunk.match(/^[\s\S]*[.!?。…\n](?=\s|$)/);
      if (!m) return;
      chunk = m[0];
    }
    spokenUpTo += chunk.length;
    if (chunk.trim()) speak(chunk);
  };

  try {
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const raw = buf.slice(0, idx); buf = buf.slice(idx + 2);
        const dataLine = raw.split("\n").find(l => l.startsWith("data:"));
        if (!dataLine) continue;
        let ev; try { ev = JSON.parse(dataLine.slice(5)); } catch { continue; }
        if (ev.type === "content_block_start" && ev.content_block?.type === "server_tool_use") {
          searching = true; setStatus("검색 중…");
        } else if (ev.type === "content_block_delta" && ev.delta?.type === "text_delta") {
          if (searching) { searching = false; setStatus("대답 중…"); }
          full += ev.delta.text;
          bubble.textContent = stripMemory(full, true);
          log.scrollTop = log.scrollHeight;
          flushSpeech(false);
        } else if (ev.type === "message_delta") {
          stopReason = ev.delta?.stop_reason || stopReason;
        } else if (ev.type === "error") {
          throw new Error(ev.error?.message || "stream error");
        }
      }
    }
  } catch (e) {
    if (e.name === "AbortError") { full = full || "(중단됨)"; }
    else { bubble.remove(); return fail("대답을 받는 중에 끊겼어요. 다시 말씀해 주세요."); }
  }

  if (stopReason === "refusal" && !full.trim()) full = "죄송해요, 그 요청은 도와드리기 어려워요.";
  if (stopReason === "pause_turn" && !full.trim()) full = "검색이 길어지고 있어요. 한 번 더 물어봐 주시겠어요?";

  // memory tags
  const mems = [...full.matchAll(/\[\[기억:\s*([^\]]+)\]\]/g)].map(m => m[1].trim());
  if (mems.length) {
    const stamp = new Date().toLocaleDateString("ko-KR");
    settings.memories = (settings.memories ? settings.memories.trimEnd() + "\n" : "") + mems.map(m => `- ${m} (${stamp})`).join("\n");
    LS.set("settings", settings);
    addMsg("sys", "기억했어요: " + mems.join(" / "));
  }
  const clean = stripMemory(full).trim() || "…";
  bubble.textContent = clean;
  flushSpeech(true);
  history.push({ role: "assistant", content: clean });
  if (history.length > MAX_TURNS * 4) history = history.slice(-MAX_TURNS * 2);
  LS.set("history", history);
  busy = false;

  const done = () => {
    setOrb(""); setStatus("가운데를 누르고 말씀하세요");
    if (settings.handsfree) startListening();
  };
  if (settings.voiceOut && synth) whenSpeechDone(done); else done();
}
function stripMemory(t, partial) {
  let s = t.replace(/\[\[기억:[^\]]*\]\]/g, "");
  if (partial) s = s.replace(/\[\[[^\]]*$/, "");
  return s;
}
function fail(msg) {
  addMsg("sys", msg, "err");
  history.pop();             // drop the unanswered user turn
  LS.set("history", history);
  busy = false; setOrb(""); setStatus("가운데를 누르고 말씀하세요");
}

// ---------- Events ----------
$("orb").addEventListener("click", () => {
  unlockAudio();
  if (busy) { if (abortCtl) abortCtl.abort(); stopSpeaking(); return; }
  if (listening) { stopListening(); return; }
  if (speakQueue) { stopSpeaking(); setOrb(""); setStatus("가운데를 누르고 말씀하세요"); return; }
  startListening();
});
$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const t = $("text").value; $("text").value = ""; send(t);
});
$("newBtn").addEventListener("click", () => {
  stopSpeaking(); history = []; LS.set("history", history); renderHistory();
});
function syncChips() {
  $("handsfree").classList.toggle("on", !!settings.handsfree);
  $("voiceOut").classList.toggle("on", !!settings.voiceOut);
}
$("handsfree").addEventListener("click", () => { settings.handsfree = !settings.handsfree; LS.set("settings", settings); syncChips(); });
$("voiceOut").addEventListener("click", () => { settings.voiceOut = !settings.voiceOut; if (!settings.voiceOut) stopSpeaking(); LS.set("settings", settings); syncChips(); });

function openSettings() {
  $("apiKey").value = settings.apiKey; $("userName").value = settings.userName;
  $("model").value = settings.model; $("rate").value = settings.rate; $("pitch").value = settings.pitch ?? 0.8;
  $("briefing").value = settings.briefing; $("memories").value = settings.memories;
  loadVoices();
  $("sheet").classList.add("open");
}
function readForm() {
  settings.apiKey = $("apiKey").value.trim();
  settings.userName = $("userName").value.trim() || "제이슨님";
  settings.model = $("model").value; settings.voice = $("voice").value;
  settings.rate = Number($("rate").value); settings.pitch = Number($("pitch").value);
  settings.briefing = $("briefing").value; settings.memories = $("memories").value;
}
$("setBtn").addEventListener("click", openSettings);
$("voice").addEventListener("change", () => renderVoiceList(synth ? synth.getVoices().filter(v => /^ko/i.test(v.lang)) : []));
$("previewBtn").addEventListener("click", () => {
  readForm(); unlockAudio(); stopSpeaking();
  speak(`안녕하세요, ${settings.userName}. 자비스입니다. 모든 시스템이 정상 작동 중입니다.`);
});
$("jarvisPreset").addEventListener("click", () => {
  const ko = synth ? synth.getVoices().filter(v => /^ko/i.test(v.lang)) : [];
  const v = ko.find(v => /^reed/i.test(v.name)) || ko.find(v => /^(eddy|rocko)/i.test(v.name));
  if (v) $("voice").value = v.name;
  renderVoiceList(ko);
  $("pitch").value = 0.8; $("rate").value = 0.95;
  $("previewBtn").click();
});
$("closeBtn").addEventListener("click", () => $("sheet").classList.remove("open"));
$("saveBtn").addEventListener("click", () => {
  readForm(); LS.set("settings", settings); $("sheet").classList.remove("open");
  setStatus("저장했어요.");
  unlockAudio(); speak("설정을 저장했습니다.");
});
$("exportBtn").addEventListener("click", async () => {
  readForm();
  const code = "JARVIS1:" + btoa(unescape(encodeURIComponent(JSON.stringify(settings))));
  try { await navigator.clipboard.writeText(code); alertLike("복사했어요. 다른 기기의 자비스에서 '설정 붙여넣기'를 누르세요. 이 코드에는 API 키가 들어 있으니 남에게 보내지 마세요."); }
  catch { prompt("아래 코드를 복사하세요 (API 키 포함, 남에게 보내지 마세요)", code); }
});
$("importBtn").addEventListener("click", async () => {
  let code = "";
  try { code = await navigator.clipboard.readText(); } catch {}
  if (!code.startsWith("JARVIS1:")) code = prompt("복사한 설정 코드를 붙여넣으세요") || "";
  if (!code.startsWith("JARVIS1:")) return;
  try {
    const obj = JSON.parse(decodeURIComponent(escape(atob(code.slice(8)))));
    settings = Object.assign(settings, obj, { voice: settings.voice });
    LS.set("settings", settings); openSettings(); alertLike("설정을 가져왔어요.");
  } catch { alertLike("코드가 올바르지 않아요."); }
});
function alertLike(t) { setStatus(t); addMsg("sys", t); }

syncChips();
renderHistory();
if (!settings.apiKey) { addMsg("sys", "처음이시죠? 오른쪽 위 '설정'에서 Claude API 키를 넣어주세요."); }
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
})();
</script>
</body>
</html>
